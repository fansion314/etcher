name: Release Etcher dnr for Arch

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-dnr.[0-9]+'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-etcher-dnr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check AUR package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in the official Arch image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          mkdir -p dist/release
          docker pull ghcr.io/archlinux/archlinux:base-devel
          docker image inspect ghcr.io/archlinux/archlinux:base-devel \
            --format '{{json .RepoDigests}}' > dist/release/container-image.txt
          docker run --rm \
            --volume "$PWD:/work" \
            --env "ETCHER_BUILD_UID=$(id -u)" \
            --workdir /work \
            ghcr.io/archlinux/archlinux:base-devel \
            bash scripts/ci/build-dnr-arch.sh "$RELEASE_TAG" "$RELEASE_COMMIT" \
            2>&1 | tee dist/release/build.log

      - name: Upload tested package and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etcher-dnr-arch
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

      - name: Preserve failed build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etcher-dnr-build-log
          path: dist/release/build.log
          if-no-files-found: ignore

  release:
    concurrency:
      group: publish-dnr-${{ github.ref_name }}
      cancel-in-progress: false
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: etcher-dnr-arch
          path: release-assets
      - name: Publish checked package and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-dnr-arch.sh
